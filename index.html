<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مطعم أبو عمران | قائمة الطعام</title>
  <meta name="description" content="قائمة طعام مطعم أبو عمران - حمص، فول، فتة، ماليزية وخدمة ديلفري" />
  <link rel="icon" type="image/png" href="./assets/logo.png" />

  <!-- Arabic Calligraphy & Clean Display Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@400;500;700;800&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="page-backdrop">
    <main class="menu-sheet" aria-label="قائمة طعام مطعم أبو عمران">
      <!-- Ornamental Gold Frame & Corner Filigrees -->
      <div class="frame-outer" aria-hidden="true">
        <div class="frame-inner"></div>
        <svg class="corner corner-tr" viewBox="0 0 80 80" fill="none">
          <path d="M74 6H34C22 6 18 14 18 22C18 28 24 31 28 27C31 24 28 19 24 20M74 6V46C74 58 66 62 58 62C52 62 49 56 53 52C56 49 61 52 60 56M74 6C58 8 44 20 40 36C36 22 24 14 10 14M66 14C56 16 48 24 46 34" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <circle cx="74" cy="6" r="3" fill="currentColor"/>
          <circle cx="38" cy="38" r="2.2" fill="currentColor"/>
        </svg>
        <svg class="corner corner-tl" viewBox="0 0 80 80" fill="none">
          <path d="M74 6H34C22 6 18 14 18 22C18 28 24 31 28 27C31 24 28 19 24 20M74 6V46C74 58 66 62 58 62C52 62 49 56 53 52C56 49 61 52 60 56M74 6C58 8 44 20 40 36C36 22 24 14 10 14M66 14C56 16 48 24 46 34" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <circle cx="74" cy="6" r="3" fill="currentColor"/>
          <circle cx="38" cy="38" r="2.2" fill="currentColor"/>
        </svg>
        <svg class="corner corner-br" viewBox="0 0 80 80" fill="none">
          <path d="M74 6H34C22 6 18 14 18 22C18 28 24 31 28 27C31 24 28 19 24 20M74 6V46C74 58 66 62 58 62C52 62 49 56 53 52C56 49 61 52 60 56M74 6C58 8 44 20 40 36C36 22 24 14 10 14M66 14C56 16 48 24 46 34" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <circle cx="74" cy="6" r="3" fill="currentColor"/>
          <circle cx="38" cy="38" r="2.2" fill="currentColor"/>
        </svg>
        <svg class="corner corner-bl" viewBox="0 0 80 80" fill="none">
          <path d="M74 6H34C22 6 18 14 18 22C18 28 24 31 28 27C31 24 28 19 24 20M74 6V46C74 58 66 62 58 62C52 62 49 56 53 52C56 49 61 52 60 56M74 6C58 8 44 20 40 36C36 22 24 14 10 14M66 14C56 16 48 24 46 34" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <circle cx="74" cy="6" r="3" fill="currentColor"/>
          <circle cx="38" cy="38" r="2.2" fill="currentColor"/>
        </svg>
      </div>

      <!-- Subtle Botanical Side Accents (matching the poster's olive & lemon vibe) -->
      <svg class="botanical botanical-right" viewBox="0 0 120 420" fill="none" aria-hidden="true">
        <path d="M98 40C78 90 72 150 86 210C96 255 82 325 60 385" stroke="#5E7342" stroke-width="2.4" stroke-linecap="round" opacity="0.55"/>
        <ellipse cx="70" cy="78" rx="16" ry="7" transform="rotate(-25 70 78)" fill="#7A9153" opacity="0.45"/>
        <ellipse cx="96" cy="112" rx="15" ry="6.5" transform="rotate(28 96 112)" fill="#6B8246" opacity="0.45"/>
        <ellipse cx="64" cy="150" rx="17" ry="7" transform="rotate(-18 64 150)" fill="#849B5C" opacity="0.45"/>
        <ellipse cx="94" cy="255" rx="15" ry="6.5" transform="rotate(20 94 255)" fill="#7A9153" opacity="0.42"/>
        <ellipse cx="58" cy="312" rx="16" ry="7" transform="rotate(-30 58 312)" fill="#6B8246" opacity="0.42"/>
        <circle cx="80" cy="128" r="6" fill="#7D8C34" opacity="0.6"/>
        <circle cx="74" cy="276" r="5.5" fill="#7D8C34" opacity="0.6"/>
        <circle cx="88" cy="204" r="24" fill="#E3C78A" stroke="#B68B40" stroke-width="2" opacity="0.42"/>
        <circle cx="88" cy="204" r="15" fill="#D4AC4B" opacity="0.45"/>
        <circle cx="72" cy="346" r="10" fill="#D64933" opacity="0.55"/>
        <circle cx="90" cy="358" r="9" fill="#C93B26" opacity="0.5"/>
      </svg>

      <svg class="botanical botanical-left" viewBox="0 0 120 420" fill="none" aria-hidden="true">
        <path d="M22 40C42 90 48 150 34 210C24 255 38 325 60 385" stroke="#5E7342" stroke-width="2.4" stroke-linecap="round" opacity="0.55"/>
        <ellipse cx="50" cy="78" rx="16" ry="7" transform="rotate(25 50 78)" fill="#7A9153" opacity="0.45"/>
        <ellipse cx="24" cy="112" rx="15" ry="6.5" transform="rotate(-28 24 112)" fill="#6B8246" opacity="0.45"/>
        <ellipse cx="56" cy="150" rx="17" ry="7" transform="rotate(18 56 150)" fill="#849B5C" opacity="0.45"/>
        <ellipse cx="26" cy="255" rx="15" ry="6.5" transform="rotate(-20 26 255)" fill="#7A9153" opacity="0.42"/>
        <ellipse cx="62" cy="312" rx="16" ry="7" transform="rotate(30 62 312)" fill="#6B8246" opacity="0.42"/>
        <circle cx="40" cy="128" r="6" fill="#7D8C34" opacity="0.6"/>
        <circle cx="46" cy="276" r="5.5" fill="#7D8C34" opacity="0.6"/>
        <circle cx="32" cy="204" r="24" fill="#E3C78A" stroke="#B68B40" stroke-width="2" opacity="0.42"/>
        <circle cx="32" cy="204" r="15" fill="#D4AC4B" opacity="0.45"/>
        <circle cx="48" cy="346" r="10" fill="#D64933" opacity="0.55"/>
        <circle cx="30" cy="358" r="9" fill="#C93B26" opacity="0.5"/>
      </svg>

      <!-- Top Bar: Cart Trigger -->
      <div class="top-utility">
        <button type="button" class="cart-pill-btn" id="openCartBtn" aria-label="فتح سلة الطلبات">
          <span class="cart-icon" aria-hidden="true">🛒</span>
          <span>السلة</span>
          <span class="cart-badge" id="topCartCount">0</span>
        </button>
      </div>

      <!-- Brand Header -->
      <header class="brand-header">
        <div class="logo-ring">
          <img
            src="./assets/logo.png"
            alt="شعار مطعم أبو عمران"
            class="brand-logo"
            width="108"
            height="108"
          />
        </div>
        <h1 class="brand-title">مَطْعَمُ أَبُو عِمْرَانْ</h1>

        <!-- Ornate Arabesque Divider -->
        <div class="ornate-divider" aria-hidden="true">
          <svg viewBox="0 0 320 28" fill="none">
            <path d="M10 14H116M204 14H310" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M126 14C136 6 146 6 160 14C174 6 184 6 194 14C184 22 174 22 160 14C146 22 136 22 126 14Z" stroke="currentColor" stroke-width="1.7" fill="rgba(184,137,53,0.16)"/>
            <circle cx="160" cy="14" r="3.5" fill="currentColor"/>
            <circle cx="116" cy="14" r="2.2" fill="currentColor"/>
            <circle cx="204" cy="14" r="2.2" fill="currentColor"/>
          </svg>
        </div>
      </header>

      <!-- Category Filter Tabs -->
      <nav class="category-tabs" aria-label="تصفية القائمة">
        <button type="button" class="tab-btn active" data-category="all">الكل</button>
        <button type="button" class="tab-btn" data-category="plates">الأطباق</button>
        <button type="button" class="tab-btn" data-category="boxes">علب وسفري</button>
        <button type="button" class="tab-btn" data-category="drinks">مشروبات</button>
      </nav>

      <!-- Menu List -->
      <section class="menu-section" aria-label="الأصناف">
        <ul class="menu-list" id="menuList"></ul>
      </section>

      <!-- Bottom Ornate Divider -->
      <div class="ornate-divider bottom-divider" aria-hidden="true">
        <svg viewBox="0 0 320 28" fill="none">
          <path d="M10 14H116M204 14H310" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <path d="M126 14C136 6 146 6 160 14C174 6 184 6 194 14C184 22 174 22 160 14C146 22 136 22 126 14Z" stroke="currentColor" stroke-width="1.7" fill="rgba(184,137,53,0.16)"/>
          <circle cx="160" cy="14" r="3.5" fill="currentColor"/>
          <circle cx="116" cy="14" r="2.2" fill="currentColor"/>
          <circle cx="204" cy="14" r="2.2" fill="currentColor"/>
        </svg>
      </div>

      <!-- Footer Info (matching poster) -->
      <footer class="menu-footer">
        <p class="delivery-note">موجود ديلفري إن شاء الله</p>
        <p class="phone-line">
          <span>هاتف - </span>
          <a href="tel:03478350" class="phone-link" dir="ltr">03/478350</a>
        </p>
      </footer>
    </main>
  </div>

  <!-- Sticky Bottom Cart Bar (appears when cart has items) -->
  <div class="sticky-cart-bar hidden" id="stickyCartBar">
    <div class="sticky-cart-inner">
      <div class="sticky-summary">
        <span class="sticky-count" id="stickyCount">0 أصناف</span>
        <span class="sticky-divider">•</span>
        <span class="sticky-total">المجموع: <strong id="stickyTotal">0</strong></span>
      </div>
      <button type="button" class="view-cart-btn" id="stickyOpenCartBtn">
        عرض السلة وإتمام الطلب
      </button>
    </div>
  </div>

  <!-- Slide-over Cart Drawer -->
  <div class="drawer-overlay hidden" id="cartOverlay" aria-hidden="true"></div>
  <aside
    class="cart-drawer hidden"
    id="cartDrawer"
    role="dialog"
    aria-modal="true"
    aria-labelledby="cartDrawerTitle"
  >
    <div class="drawer-header">
      <div class="drawer-brand">
        <img src="./assets/logo.png" alt="" class="drawer-logo" width="38" height="38" />
        <div>
          <h2 id="cartDrawerTitle">سلة الطلبات</h2>
          <p class="drawer-subtitle">مطعم أبو عمران</p>
        </div>
      </div>
      <button type="button" class="close-drawer-btn" id="closeCartBtn" aria-label="إغلاق السلة">
        ✕
      </button>
    </div>

    <div class="drawer-body">
      <div class="empty-cart-state" id="emptyCartState">
        <p class="empty-icon" aria-hidden="true">🥙</p>
        <p class="empty-title">السلة فارغة حالياً</p>
        <p class="empty-desc">اختر الأصناف من القائمة واضغط على «أضف للسلة»</p>
      </div>

      <ul class="cart-items-list" id="cartItemsList"></ul>

      <form class="checkout-form hidden" id="checkoutForm">
        <div class="order-type-group" role="radiogroup" aria-label="نوع الطلب">
          <label class="order-type-option">
            <input type="radio" name="orderType" value="ديلفري" checked />
            <span>🛵 ديلفري</span>
          </label>
          <label class="order-type-option">
            <input type="radio" name="orderType" value="استلام من المطعم" />
            <span>🏪 استلام من المطعم</span>
          </label>
        </div>

        <label class="field-label">
          <span>الاسم (اختياري)</span>
          <input type="text" id="customerName" placeholder="مثال: أحمد" />
        </label>

        <label class="field-label" id="addressField">
          <span>العنوان</span>
          <input type="text" id="customerAddress" placeholder="المنطقة / الشارع / البناية" />
        </label>

        <label class="field-label">
          <span>ملاحظات إضافية</span>
          <textarea id="orderNotes" rows="2" placeholder="مثال: زيت زيادة، بدون ثوم، خبز إضافي..."></textarea>
        </label>
      </form>
    </div>

    <div class="drawer-footer hidden" id="drawerFooter">
      <div class="total-row">
        <span>المجموع الكلي</span>
        <strong id="drawerTotal">0</strong>
      </div>

      <div class="drawer-actions">
        <button type="button" class="btn-whatsapp" id="whatsappOrderBtn">
          إرسال الطلب عبر واتساب
        </button>
        <div class="secondary-actions">
          <button type="button" class="btn-secondary" id="copyOrderBtn">نسخ الطلب</button>
          <a href="tel:03478350" class="btn-secondary btn-call">اتصال 03/478350</a>
        </div>
        <button type="button" class="btn-clear" id="clearCartBtn">تفريغ السلة</button>
      </div>
    </div>
  </aside>

  <!-- Toast Notification -->
  <div class="toast hidden" id="toast" role="status" aria-live="polite"></div>

  <script src="./script.js"></script>
</body>
</html>
